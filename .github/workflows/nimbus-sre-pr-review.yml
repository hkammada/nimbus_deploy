# Triggered on every new PR and on new commits to an open PR.
# Fails the check (blocks merge) when JSON validation or secret scan fails.
# After human approval + green checks, merge via nimbus-sre-scheduled-merge.yml

name: Nimbus SRE PR Review (Level-1)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  level1-review:
    name: Nimbus SRE Level-1 PR Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Run Level-1 validation
        id: validate
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          REPORT_FILE="${RUNNER_TEMP}/level1-report.txt"
          JSON_FAIL=0
          SECRET_FAIL=0

          {
            echo "==> Repository: se-wdpr-infrastructure/nimbus_deploy"
            echo "==> PR: #${{ github.event.pull_request.number }} (${{ github.head_ref }} -> ${{ github.base_ref }})"
            echo "==> Diff: ${BASE}...HEAD"
            echo ""
            git diff --name-status "${BASE}...HEAD" || true
            echo ""
            echo "==> JSON validation:"
          } > "$REPORT_FILE"

          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            [[ "$f" == *.json ]] || continue
            if [[ ! -f "$f" ]]; then
              echo "  FAIL: $f (file missing on PR head)" | tee -a "$REPORT_FILE"
              JSON_FAIL=1
              continue
            fi
            if python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "  PASS: $f" | tee -a "$REPORT_FILE"
            else
              echo "  FAIL: $f" | tee -a "$REPORT_FILE"
              JSON_FAIL=1
            fi
          done < <(git diff --name-only "${BASE}...HEAD" || true)

          if ! grep -qE '^  (PASS|FAIL):' "$REPORT_FILE"; then
            echo "  (no changed *.json files)" >> "$REPORT_FILE"
          fi

          {
            echo ""
            echo "==> Secret scan (diff only):"
          } >> "$REPORT_FILE"

          SECRET_HITS=$(git diff "${BASE}...HEAD" | grep -Ein \
            '(password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|secret[_-]?key|client[_-]?secret|private[_-]?key|credential|aws_access_key|aws_secret_access_key)' \
            | grep -Ev 'splunk_token.*<%=' | grep -Ev '"name"[[:space:]]*:[[:space:]]*".*(KEY|TOKEN|SECRET)"' || true)

          if [[ -n "$SECRET_HITS" ]]; then
            echo "  FAIL: Potential secret patterns in diff (merge blocked):" >> "$REPORT_FILE"
            echo "$SECRET_HITS" | head -20 >> "$REPORT_FILE"
            SECRET_FAIL=1
          else
            echo "  PASS: No obvious secret patterns in diff." >> "$REPORT_FILE"
          fi

          {
            echo ""
            echo "==> Result:"
          } >> "$REPORT_FILE"

          if [[ "$JSON_FAIL" -ne 0 || "$SECRET_FAIL" -ne 0 ]]; then
            echo "  FAILED — fix issues and push again. Merge is blocked until this check passes." >> "$REPORT_FILE"
            echo "validation_passed=false" >> "$GITHUB_OUTPUT"
            echo "json_failed=${JSON_FAIL}" >> "$GITHUB_OUTPUT"
            echo "secret_failed=${SECRET_FAIL}" >> "$GITHUB_OUTPUT"
          else
            echo "  PASSED — human SRE approval still required before scheduled merge." >> "$REPORT_FILE"
            echo "validation_passed=true" >> "$GITHUB_OUTPUT"
            echo "json_failed=0" >> "$GITHUB_OUTPUT"
            echo "secret_failed=0" >> "$GITHUB_OUTPUT"
          fi

          {
            echo 'report<<EOF'
            cat "$REPORT_FILE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          if [[ "$JSON_FAIL" -ne 0 || "$SECRET_FAIL" -ne 0 ]]; then
            echo "::error::Nimbus SRE Level-1 validation failed — merge blocked until fixed."
            exit 1
          fi

      - name: Post PR comment
        if: always() && steps.validate.outputs.report != ''
        uses: actions/github-script@v7
        env:
          VALIDATION_PASSED: ${{ steps.validate.outputs.validation_passed }}
        with:
          script: |
            const marker = '<!-- nimbus-sre-level1-review -->';
            const report = `${{ steps.validate.outputs.report }}`;
            const passed = process.env.VALIDATION_PASSED === 'true';
            const statusLine = passed
              ? '✅ **PASSED** — automated Level-1 checks succeeded.'
              : '❌ **FAILED** — merge is **blocked** until this check passes. Fix issues and push again.';
            const body = [
              marker,
              '## Nimbus SRE Level-1 PR Review (automated)',
              '',
              statusLine,
              '',
              'Human SRE approval is still required before merge (in addition to this check).',
              '',
              'When approved and all checks are green, run **Actions → Nimbus SRE Scheduled Merge**.',
              '',
              '<details>',
              '<summary>Validation output</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo, number } = context.issue;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body,
              });
            }
